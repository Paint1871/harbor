[package]
name = "harbor-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native desktop host for Harbor"

[lib]
name = "harbor_desktop"

[[bin]]
name = "harbor"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
harbor-core.workspace = true
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
tauri-plugin-fs = "=2.5.2"
tauri-plugin-http = { version = "=2.6.0", default-features = false, features = ["rustls-tls"] }
tauri-plugin-clipboard-manager = "=2.3.3"
dirs = "=6.0.0"
serde_json = "=1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
oslog = { version = "=0.2.0", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"
serde_json = "=1.0.151"
