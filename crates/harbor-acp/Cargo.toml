[package]
name = "harbor-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ACP v1 client host for Harbor"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "=3.27.0"
