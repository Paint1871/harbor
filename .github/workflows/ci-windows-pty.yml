name: Windows PTY

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pty-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pty:
    name: PowerShell PTY gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - run: cargo test -p harbor-pty -p harbor-paths --locked --all-targets
      - name: Named executable on failure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Harbor must name the executable when a launch fails.
          cargo test -p harbor-pty --locked -- --nocapture
