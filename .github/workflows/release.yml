name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: Signed macOS (placeholder)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Refuse unsigned
        run: |
          set -euo pipefail
          if grep -q placeholder apps/desktop/src-tauri/minisign.pub; then
            echo "minisign.pub is a placeholder; this workflow will not publish an update."
          fi
          cargo test -p harbor-updater --locked
