name: ACP handshake

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acp-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fake-agent:
    name: Fake-agent fixtures
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - run: cargo test -p harbor-acp --locked --all-targets

  opencode:
    name: OpenCode initialize + session/new
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned OpenCode CLI
        run: |
          set -euo pipefail
          # Pin lives in packages/engine-catalog/src/catalog.json (minVersion).
          npm install -g opencode-ai@latest
          command -v opencode
          opencode --version
      - name: initialize + session/new
        run: python3 scripts/acp-handshake.py
