name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  brand:
    name: Clean-room guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: bash scripts/deny-brand.sh

  rust:
    name: Rust format, Clippy, and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Install Tauri system libraries
        # harbor-desktop links GTK and WebKitGTK, so a bare runner cannot even
        # type-check the workspace. Tauri 2 uses the webkit2gtk 4.1 line.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  workspace:
    name: pnpm workspace
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:workspace
      - run: pnpm check:test
